name: Release

on:
  push:
    branches:
      - master
      - staging
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/iotables-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/iotables-frontend
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_CHANNEL: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}
  RELEASE_PATH: /opt/iotables

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: pnpm

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run check

  publish:
    name: Publish runtime images
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_CHANNEL }}-latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile.production
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_CHANNEL }}-latest

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: publish
    environment: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/iotables_deploy
          chmod 600 ~/.ssh/iotables_deploy
          ssh-keyscan -p "${{ secrets.VPS_SSH_PORT || '22' }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload deployment files
        run: |
          ssh -i ~/.ssh/iotables_deploy -p "${{ secrets.VPS_SSH_PORT || '22' }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p '${{ env.RELEASE_PATH }}/nginx'"
          scp -i ~/.ssh/iotables_deploy -P "${{ secrets.VPS_SSH_PORT || '22' }}" compose.production.yaml "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.RELEASE_PATH }}/compose.yaml"
          scp -i ~/.ssh/iotables_deploy -P "${{ secrets.VPS_SSH_PORT || '22' }}" deploy/nginx/default.conf "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.RELEASE_PATH }}/nginx/default.conf"

      - name: Release
        run: |
          ssh -i ~/.ssh/iotables_deploy -p "${{ secrets.VPS_SSH_PORT || '22' }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
            set -euo pipefail
            cd '${{ env.RELEASE_PATH }}'
            test -f .env
            printf '%s\n' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            IOTABLES_IMAGE_OWNER='${{ github.repository_owner }}' IOTABLES_IMAGE_TAG='${{ env.IMAGE_TAG }}' docker compose pull
            IOTABLES_IMAGE_OWNER='${{ github.repository_owner }}' IOTABLES_IMAGE_TAG='${{ env.IMAGE_TAG }}' docker compose run --rm backend uv run alembic upgrade head
            IOTABLES_IMAGE_OWNER='${{ github.repository_owner }}' IOTABLES_IMAGE_TAG='${{ env.IMAGE_TAG }}' docker compose up -d --remove-orphans
            docker image prune -f
          "

      - name: Smoke check
        run: |
          curl --fail --show-error --retry 12 --retry-delay 5 "${{ secrets.RELEASE_HEALTH_URL }}"
