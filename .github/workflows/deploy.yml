name: Deploy

on:
  push:
    branches:
      - production
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/iotables-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/iotables-frontend
  IMAGE_TAG: sha-${{ github.sha }}
  IMAGE_CHANNEL: ${{ github.ref_name == 'staging' && 'staging' || github.ref_name == 'production' && 'production' || 'invalid' }}
  DEPLOY_PATH: /opt/iotables

jobs:
  reject-unsupported-branch:
    name: Reject unsupported deployment branch
    runs-on: ubuntu-latest
    if: ${{ github.ref_name != 'staging' && github.ref_name != 'production' }}

    steps:
      - name: Explain deployment branch policy
        run: |
          echo "Deploy workflow may run only from staging or production."
          echo "Promotion path is feature/* -> integration -> staging -> production."
          exit 1

  verify:
    name: Verify deployment candidate
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'staging' || github.ref_name == 'production' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify production commit is staged
        if: ${{ github.ref_name == 'production' }}
        run: |
          git fetch origin staging:refs/remotes/origin/staging
          git merge-base --is-ancestor HEAD refs/remotes/origin/staging || {
            echo "Production must point to a commit that exists in staging history."
            echo "Use feature/* -> integration -> staging -> production without creating a production-only commit."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: pnpm

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run check

  publish:
    name: Publish staging images or verify production images
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ github.ref_name == 'staging' || github.ref_name == 'production' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify backend image exists for production promotion
        if: ${{ github.ref_name == 'production' }}
        run: docker buildx imagetools inspect "${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}" > /dev/null

      - name: Verify frontend image exists for production promotion
        if: ${{ github.ref_name == 'production' }}
        run: docker buildx imagetools inspect "${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}" > /dev/null

      - name: Build and push backend image
        if: ${{ github.ref_name == 'staging' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_CHANNEL }}-latest

      - name: Build and push frontend image
        if: ${{ github.ref_name == 'staging' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile.production
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_CHANNEL }}-latest

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ github.ref_name == 'staging' || github.ref_name == 'production' }}
    environment: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry for production promotion
        if: ${{ github.ref_name == 'production' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx for production promotion
        if: ${{ github.ref_name == 'production' }}
        uses: docker/setup-buildx-action@v3

      - name: Promote backend image tag
        if: ${{ github.ref_name == 'production' }}
        run: |
          docker buildx imagetools create \
            -t "${{ env.BACKEND_IMAGE }}:production-latest" \
            "${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}"

      - name: Promote frontend image tag
        if: ${{ github.ref_name == 'production' }}
        run: |
          docker buildx imagetools create \
            -t "${{ env.FRONTEND_IMAGE }}:production-latest" \
            "${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}"

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/iotables_deploy
          chmod 600 ~/.ssh/iotables_deploy
          ssh-keyscan -p "${{ secrets.DEPLOY_SSH_PORT || '22' }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload deployment files
        run: |
          ssh -i ~/.ssh/iotables_deploy -p "${{ secrets.DEPLOY_SSH_PORT || '22' }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "mkdir -p '${{ env.DEPLOY_PATH }}/nginx' '${{ env.DEPLOY_PATH }}/certs'"
          scp -i ~/.ssh/iotables_deploy -P "${{ secrets.DEPLOY_SSH_PORT || '22' }}" compose.deploy.yaml "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/compose.yaml"
          scp -i ~/.ssh/iotables_deploy -P "${{ secrets.DEPLOY_SSH_PORT || '22' }}" deploy/nginx/default.conf "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/nginx/default.conf"

      - name: Deploy
        run: |
          ssh -i ~/.ssh/iotables_deploy -p "${{ secrets.DEPLOY_SSH_PORT || '22' }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "
            set -euo pipefail
            cd '${{ env.DEPLOY_PATH }}'
            test -f .env
            test -f certs/origin.pem
            test -f certs/origin.key
            printf '%s\n' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            IOTABLES_IMAGE_OWNER='${{ github.repository_owner }}' IOTABLES_IMAGE_TAG='${{ env.IMAGE_TAG }}' docker compose pull
            IOTABLES_IMAGE_OWNER='${{ github.repository_owner }}' IOTABLES_IMAGE_TAG='${{ env.IMAGE_TAG }}' docker compose run --rm backend uv run alembic upgrade head
            IOTABLES_IMAGE_OWNER='${{ github.repository_owner }}' IOTABLES_IMAGE_TAG='${{ env.IMAGE_TAG }}' docker compose up -d --remove-orphans
            docker image prune -f
          "

      - name: Smoke check
        run: |
          curl --fail --show-error --retry 12 --retry-delay 5 "${{ secrets.DEPLOY_HEALTH_URL }}"
