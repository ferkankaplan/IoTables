services:
  db:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - iotables_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: ghcr.io/${IOTABLES_IMAGE_OWNER:?IOTABLES_IMAGE_OWNER is required}/iotables-backend:${IOTABLES_IMAGE_TAG:?IOTABLES_IMAGE_TAG is required}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      IOTABLES_ENV: ${IOTABLES_ENV:?IOTABLES_ENV is required}
      IOTABLES_LOG_LEVEL: ${IOTABLES_LOG_LEVEL:-INFO}
      IOTABLES_DATABASE_URL: ${IOTABLES_DATABASE_URL:?IOTABLES_DATABASE_URL is required}
      IOTABLES_SECURITY_SECRET_KEY: ${IOTABLES_SECURITY_SECRET_KEY:?IOTABLES_SECURITY_SECRET_KEY is required}
      IOTABLES_CORS_ORIGINS: ${IOTABLES_CORS_ORIGINS:?IOTABLES_CORS_ORIGINS is required}
      IOTABLES_TENANT_ROOT_DOMAINS: ${IOTABLES_TENANT_ROOT_DOMAINS:?IOTABLES_TENANT_ROOT_DOMAINS is required}
    expose:
      - "8000"

  frontend:
    image: ghcr.io/${IOTABLES_IMAGE_OWNER:?IOTABLES_IMAGE_OWNER is required}/iotables-frontend:${IOTABLES_IMAGE_TAG:?IOTABLES_IMAGE_TAG is required}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${IOTABLES_HTTP_PORT:?IOTABLES_HTTP_PORT is required}:80"
      - "${IOTABLES_HTTPS_PORT:?IOTABLES_HTTPS_PORT is required}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

volumes:
  iotables_postgres_data:
