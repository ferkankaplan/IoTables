services:
  postgres:
    image: postgres:18.4
    container_name: iotables-postgres
    environment:
      POSTGRES_DB: iotables
      POSTGRES_USER: iotables
      POSTGRES_PASSWORD: iotables
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iotables -d iotables"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
