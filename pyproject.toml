[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[project]
name = "iotables"
version = "0.1.0"
description = "IoTables backend API"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.17",
  "asyncpg>=0.31",
  "cryptography>=49.0.0",
  "fastapi>=0.124",
  "pydantic-settings>=2.12",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.38",
]

[dependency-groups]
dev = [
  "httpx2>=2.5.0",
  "pytest>=9.0",
  "pytest-asyncio>=1.3",
  "ruff>=0.14",
  "tzdata>=2026.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iotables"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
